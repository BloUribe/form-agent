[project]
name = "form-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.38",
    "fastapi>=0.163.1",
    "fpdf2>=2.9.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.10",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "playwright>=1.65.2",
    "pydantic-settings>=2.16.3",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "resend>=2.53.2",
    "svix>=2.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
form-agent = "form_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/form_agent"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.43",
]
